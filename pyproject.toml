[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icbench"
version = "0.1.0"
description = "Intracortical (spike-count) decoding testbed for LSL fault injection"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy", "scipy", "h5py", "pandas", "scikit-learn", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
